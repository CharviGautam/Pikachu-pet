<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu</title>
    <link rel="stylesheet" href="/src/shared/palette.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #pet-canvas {
        display: block;
        width: 100vw;   /* always fill the OS window; the renderer keeps */
        height: 100vh;  /* the 256-logical design space via setTransform  */
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas" width="256" height="256"></canvas>
    <script type="module" src="/src/pet/main.ts"></script>
  </body>
</html>
